apiVersion: v1
kind: Service
metadata:
  name: koradb-primary-headless
  namespace: koradb
  labels:
    app.kubernetes.io/name: koradb
    app.kubernetes.io/component: primary
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: koradb
    app.kubernetes.io/component: primary
  ports:
    - name: sql
      port: 8765
      targetPort: 8765
    - name: replication
      port: 8766
      targetPort: 8766
    - name: metrics
      port: 9100
      targetPort: 9100
