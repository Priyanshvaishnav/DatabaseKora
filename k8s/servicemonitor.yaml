apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: koradb-servicemonitor
  namespace: koradb
  labels:
    app.kubernetes.io/name: koradb
    release: prometheus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: koradb
      app.kubernetes.io/component: metrics
  endpoints:
    - port: metrics
      path: /metrics
      interval: 10s
      scrapeTimeout: 5s
