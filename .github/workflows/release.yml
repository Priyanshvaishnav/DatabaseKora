name: Release & Distribution

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release (e.g. v2.0.1)'
        required: false
        default: 'v2.0.1'

permissions:
  contents: write
  packages: write

jobs:
  build-and-release:
    name: Build & Publish Release Assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build JAR Packages
        run: mvn clean package -DskipTests -B

      - name: Assemble Distribution Bundle
        run: |
          VERSION="${{ github.ref_name }}"
          if [ -z "$VERSION" ] || [[ "$VERSION" == *"/"* ]]; then
            VERSION="${{ github.event.inputs.tag_name || 'v2.0.1' }}"
          fi
          echo "Packaging distribution for version: $VERSION"

          DIST_DIR="koradb-$VERSION"
          mkdir -p "$DIST_DIR/bin" "$DIST_DIR/lib"

          # Copy launchers
          cp bin/koradb "$DIST_DIR/bin/"
          cp bin/koradb.cmd "$DIST_DIR/bin/"
          cp bin/koradb.ps1 "$DIST_DIR/bin/"
          chmod +x "$DIST_DIR/bin/koradb"

          # Copy runnable fat jars
          cp kora-server/target/koradb-server.jar "$DIST_DIR/lib/"
          cp kora-cli/target/koradb-cli.jar "$DIST_DIR/lib/"
          cp kora-jdbc/target/koradb-jdbc.jar "$DIST_DIR/lib/" 2>/dev/null || true
          cp benchmarks/target/benchmarks.jar "$DIST_DIR/lib/" 2>/dev/null || true

          # Copy docs
          cp README.md LICENSE "$DIST_DIR/"

          # Create archives
          tar -czf koradb-dist.tar.gz "$DIST_DIR"
          zip -r koradb-dist.zip "$DIST_DIR"
          cp koradb-dist.tar.gz "koradb-$VERSION-all.tar.gz"
          cp koradb-dist.zip "koradb-$VERSION-all.zip"

          # Compute checksums
          sha256sum koradb-dist.tar.gz koradb-dist.zip > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || github.event.inputs.tag_name }}
          name: KoraDB ${{ github.ref_name || github.event.inputs.tag_name }}
          body_path: RELEASE_NOTES_v2.0.1.md
          draft: false
          prerelease: false
          files: |
            koradb-dist.tar.gz
            koradb-dist.zip
            koradb-*-all.tar.gz
            koradb-*-all.zip
            kora-jdbc/target/koradb-jdbc.jar
            kora-server/target/koradb-server.jar
            kora-cli/target/koradb-cli.jar
            SHA256SUMS.txt

  publish-docker:
    name: Build & Push Docker Image (GHCR)
    runs-on: ubuntu-latest
    needs: build-and-release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
